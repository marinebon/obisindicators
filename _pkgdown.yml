url: https://marinebon.org/obisindicators
template:
  bootstrap: 5

articles:
- title: Shipped data
  desc: In-memory indicators and static maps from the `occ_*` datasets that ship with the package.
  navbar: Shipped data
  contents:
  - obisindicators
  - regional_diversity
  - resolution
  - temporal_subsets
  - h3
- title: The obis_h3 store
  desc: >
    Build and serve a DuckDB store of OBIS binned to H3, filter it by any WoRMS
    taxon or Essential Ocean Variable, and roll it up across resolutions, decades
    and places. The store articles are precomputed against a local store by
    `data-raw/precompute_articles.R` and double as the figure notebooks of the
    OBIS → H3 → EOV manuscript (see `paper/`).
  navbar: The obis_h3 store
  contents:
  - h3t
  - articles/taxon_children
  - articles/scaling
  - articles/eov
  - articles/decadal
  - articles/places

reference:
- title: "Read"
  desc: "Functions for reading data."
  contents:
  - has_concept("read")
- title: "Store"
  desc: >
    Connect to, summarize, query and benchmark an obis_h3 DuckDB store from R.
  contents:
  - has_concept("store")
- title: "Analyze"
  desc: >
    Calculate indicators, and the paper's analyses: scale curves, rank-column vs
    subtree, EOV totals, SPUE vs SDM, periods, and place roll-ups.
  contents:
  - has_concept("analyze")
- title: "H3 grid & tiles"
  desc: "Build an H3 grid, and serve indicators as H3 hexagon tiles."
  contents:
  - make_hex_res
  - has_concept("h3t")
- title: "Taxonomy & effort proxy"
  desc: >
    Resolve children taxa (any rank), close the WoRMS coverage gap from the REST
    API, and the sightings-per-unit-effort (SPUE) proxy.
  contents:
  - has_concept("taxon")
- title: "Essential Ocean Variables"
  desc: >
    GOOS/IOOS biology & ecosystems EOVs as WoRMS AphiaID subtrees, per the IOOS
    Marine Life Data Network definitions.
  contents:
  - has_concept("eov")
- title: "Visualize"
  desc: "Functions for visualizing indicators."
  contents:
  - has_concept("visualize")
- title: "Data"
  desc: "Locally available datasets for running examples."
  contents:
  - has_concept("data")

